# Spec 0007. Weekly dependency PRs; CI (ci.yml) runs on them like on any pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates arrive as one PR; majors stay separate (one PR each).
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
