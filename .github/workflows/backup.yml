# Spec 0012. Weekly dump of the data users entered (accounts and stamps) from the production
# database, kept as an ENCRYPTED workflow artifact for 90 days (the artifacts of a public repository can be downloaded
# by everyone). The dump itself, its check, its encryption and the upload are the composite action
# .github/actions/dump-user-data, which the deploy workflow uses too (spec 0026). Restore steps: spec 0012.
# Needs the repository secrets SUPABASE_DB_URL (session pooler connection string) and BACKUP_PUBLIC_KEY (the public
# certificate the dump is encrypted to); without them the run succeeds with a notice. The secrets are only ever
# referenced, never printed: no `set -x`.
name: Backup

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Dump user data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A step's `if` can't read secrets, so only whether it is set goes into a variable.
      CONFIGURED: ${{ secrets.SUPABASE_DB_URL != '' && secrets.BACKUP_PUBLIC_KEY != '' }}
    steps:
      - name: Notice when the secret is missing
        if: env.CONFIGURED != 'true'
        run: echo "::notice title=Backup skipped::Add the repository secrets SUPABASE_DB_URL (the Supabase session pooler connection string, percent-encoded) and BACKUP_PUBLIC_KEY (the public certificate the dump is encrypted to, spec 0012) under Settings, Secrets and variables, Actions."

      - uses: actions/checkout@v7
        if: env.CONFIGURED == 'true'
      - uses: actions/setup-node@v7
        if: env.CONFIGURED == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Dump and store the user data
        if: env.CONFIGURED == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PUBLIC_KEY: ${{ secrets.BACKUP_PUBLIC_KEY }}
        uses: ./.github/actions/dump-user-data
        with:
          db-url: ${{ env.SUPABASE_DB_URL }}
          encryption-cert: ${{ env.BACKUP_PUBLIC_KEY }}
          artifact-name: user-data-backup
          retention-days: 90
