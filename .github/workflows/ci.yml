# Spec 0007. The regression gate on GitHub: the same checks Claude Code's Stop hook runs, plus the
# end-to-end tests against a local Supabase, and the security checks (npm audit, gitleaks). Needs no secrets.
name: CI

# Once per change (AC-9): a pull request runs on every update (it tests the result of merging into main), a push runs
# only on main (the merge commit, which the deploy workflow waits for, spec 0026). A branch without a pull request gets
# no run. A weekly run (AC-14) re-reads the advisories, which appear without any change of ours: it runs only the
# security job, on the tip of main.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

# A new push to a pull request cancels the run of the one before it; every commit on main is tested, so a run there is
# grouped by commit and never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      # Depth 2: on a pull request the checkout is the merge commit and its two parents, enough to list what the pull
      # request changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Spec 0007 AC-10: `code_changed` is false for a pull request that changes only Markdown, and the end-to-end job
      # then does not run. A step of this job, not a job of its own.
      - name: Does the change touch more than Markdown
        id: changes
        run: node scripts/ci-changes.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # Spec 0022 AC-5: a tripwire for the fresh-context review. The description must name, on a `Reviewed commit:` line, a
  # commit that is the head of the pull request or an ancestor of it with only Markdown changed after it. It reads the
  # description fresh through the API, so after editing the description re-run just this job
  # (`gh run rerun <run-id> --job <job-id>`); a new push runs it again by itself.
  review:
    name: Review recorded
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node scripts/check-review-recorded.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  e2e:
    name: End-to-end tests
    # AC-10: after the cheap job (a failure there stops this one: `if` without a status function implies success()), and
    # skipped for a pull request that changes only Markdown. Every push (to main) runs it, so the deploy workflow always
    # finds both jobs.
    needs: check
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.check.outputs.code_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Supabase CLI is the version pinned in package-lock.json. The app only needs the database,
      # the API gateway, auth and PostgREST; skip the rest to save image pulls.
      - name: Start local Supabase
        run: npx supabase start -x studio,mailpit,imgproxy,vector,logflare,supavisor,edge-runtime,realtime,storage-api
      - name: Generated types are up to date
        run: npm run types:check
      # The database rules of specs 0024, 0002, 0006, 0004 and 0035. They skip themselves without a local Supabase (the
      # first job has none), so only here do they run: REQUIRE_LOCAL_DB makes a database that is missing, or without the
      # schema a file expects, a failure instead of a skip, and the next step fails when no test ran or one was skipped
      # (spec 0007 AC-12, AC-13). Nothing else sets the variable.
      - name: Database rule tests
        run: npx vitest run tests/friends-migration.test.ts tests/database-rules.test.ts tests/seed-cleanup.test.ts tests/feature-flags-database.test.ts tests/flag-admin-database.test.ts tests/stamp-dates-database.test.ts tests/retired-stamps-database.test.ts --reporter=default --reporter=json --outputFile.json=database-tests-report.json
        env:
          REQUIRE_LOCAL_DB: "1"
      - name: Every database test ran
        run: node scripts/check-database-tests.mjs database-tests-report.json
      # Spec 0007 AC-6: the browser download and Next's incremental build cache survive between runs. A miss
      # only costs time.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - uses: actions/cache@v4
        with:
          path: .next-e2e/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**', 'public/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # The folder also holds the server's cached reference data (checkpoints, extra stamps, `unstable_cache` for a day,
      # spec 0002 AC-15): a restored copy would hide a changed seed or migration, so only the build cache is kept.
      - name: Drop the restored reference-data cache
        run: rm -rf .next-e2e/cache/fetch-cache
      - run: npx playwright install --with-deps chromium
      # Builds the test server through scripts/test-env.mjs (reads `supabase status`) and runs it.
      # The JSON report feeds the slowest-tests table below (spec 0007 AC-7).
      - run: npm run e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
      - name: Slowest E2E tests
        if: always()
        run: |
          if [ -f e2e-report.json ]; then node scripts/slowest-tests.mjs e2e-report.json 10 >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Spec 0007 AC-14 to AC-16: what is free on a private repository. Runs on pull requests, on pushes to main and weekly
  # (an advisory can appear without any change of ours); needs no secret and no account. It is not "needs: check": it has
  # nothing to wait for, and it runs on the weekly schedule, when the other jobs do not.
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The release is pinned by version and by the sha256 of the archive, which is the one the project publishes in
      # gitleaks_<version>_checksums.txt (the file, and GitHub's digest of the asset, were compared when it was pinned).
      # Bump both together; a download that does not match fails the step, and nothing is run from it.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # The whole history: the scan reads every commit, not only what the pull request adds.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The archive and the binary live in the runner's temp folder, outside the working tree that is scanned.
      - name: Install gitleaks
        id: gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      # The report goes to the temp folder too. The exit status of npm audit is not the verdict (it knows no allow-list):
      # the script reads the report, fails when it is not a report, and fails for an advisory the allow-list does not cover.
      - name: Known vulnerabilities in production dependencies
        if: ${{ !cancelled() }}
        run: |
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/audit-report.json" || true
          node scripts/check-audit.mjs "$RUNNER_TEMP/audit-report.json" .github/audit-allowlist.json
      # `--redact` hides the secret in everything gitleaks prints: a finding names the rule, the file, the commit and
      # the line, never the value.
      - name: Secrets in the git history
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .
      - name: Secrets in the working tree
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --verbose .
