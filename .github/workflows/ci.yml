# Spec 0007. The regression gate on GitHub: the same checks Claude Code's Stop hook runs, plus the
# end-to-end tests against a local Supabase. Needs no secrets.
name: CI

# Once per change (AC-9): a pull request runs on every update (it tests the result of merging into main), a push runs
# only on main (the merge commit, which the deploy workflow waits for, spec 0026). A branch without a pull request gets
# no run.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run of the one before it; every commit on main is tested, so a run there is
# grouped by commit and never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      # Depth 2: on a pull request the checkout is the merge commit and its two parents, enough to list what the pull
      # request changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Spec 0007 AC-10: `code_changed` is false for a pull request that changes only Markdown, and the end-to-end job
      # then does not run. A step of this job, so that no extra job is billed for it.
      - name: Does the change touch more than Markdown
        id: changes
        run: node scripts/ci-changes.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # Spec 0022 AC-5: a tripwire for the fresh-context review. The description must name, on a `Reviewed commit:` line, a
  # commit that is the head of the pull request or an ancestor of it with only Markdown changed after it. It reads the
  # description fresh through the API, so after editing the description re-run just this job
  # (`gh run rerun <run-id> --job <job-id>`); a new push runs it again by itself.
  review:
    name: Review recorded
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node scripts/check-review-recorded.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  # Spec 0007 AC-11: a pull request whose base branch has moved on is flagged. GitHub's "require branches to be up to
  # date" setting is not available for a private repository on the free plan, so this shows the state of the last run
  # and the author checks again, live, just before merging (spec 0021 AC-6). A push to the pull request runs it again.
  up-to-date:
    name: Up to date with main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node scripts/check-up-to-date.mjs

  e2e:
    name: End-to-end tests
    # AC-10: after the cheap job (a failure there stops this one: `if` without a status function implies success()), and
    # skipped for a pull request that changes only Markdown. Every push (to main) runs it, so the deploy workflow always
    # finds both jobs.
    needs: check
    if: github.event_name != 'pull_request' || needs.check.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Supabase CLI is the version pinned in package-lock.json. The app only needs the database,
      # the API gateway, auth and PostgREST; skip the rest to save image pulls.
      - name: Start local Supabase
        run: npx supabase start -x studio,mailpit,imgproxy,vector,logflare,supavisor,edge-runtime,realtime,storage-api
      - name: Generated types are up to date
        run: npm run types:check
      # The database rules of specs 0024, 0002, 0006, 0004 and 0035 (they skip themselves without a local Supabase, so only here
      # do they run).
      - name: Database rule tests
        run: npx vitest run tests/friends-migration.test.ts tests/database-rules.test.ts tests/seed-cleanup.test.ts tests/feature-flags-database.test.ts tests/flag-admin-database.test.ts tests/stamp-dates-database.test.ts
      # Spec 0007 AC-6: the browser download and Next's incremental build cache survive between runs. A miss
      # only costs time.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - uses: actions/cache@v4
        with:
          path: .next-e2e/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**', 'public/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # The folder also holds the server's cached reference data (checkpoints, extra stamps, `unstable_cache` for a day,
      # spec 0002 AC-15): a restored copy would hide a changed seed or migration, so only the build cache is kept.
      - name: Drop the restored reference-data cache
        run: rm -rf .next-e2e/cache/fetch-cache
      - run: npx playwright install --with-deps chromium
      # Builds the test server through scripts/test-env.mjs (reads `supabase status`) and runs it.
      # The JSON report feeds the slowest-tests table below (spec 0007 AC-7).
      - run: npm run e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
      - name: Slowest E2E tests
        if: always()
        run: |
          if [ -f e2e-report.json ]; then node scripts/slowest-tests.mjs e2e-report.json 10 >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
